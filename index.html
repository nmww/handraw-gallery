.tag{font-size:11px;padding:1px 6px;border-radius:99px;border:1px solid var(--line);color:var(--dim)}
.tag.ok{color:var(--ok);border-color:#26543f}.tag.bad{color:var(--bad);border-color:#5a2b30}
.tag.wait{color:var(--wait)}.tag.wm{color:#6fa8dc;border-color:#2b4a63}
.tiny{font-size:11px;opacity:.8;word-break:break-all}
.theme{color:var(--dim);font-size:12px;margin-top:4px;line-height:1.5}
details.prompt{margin-top:6px;font-size:12px}
details.prompt summary{cursor:pointer;color:#6fa8dc;user-select:none}
.ptext{background:#0b0d11;border:1px solid var(--line);border-radius:8px;padding:8px;margin-top:6px;font-size:12px;line-height:1.6;color:#c9d1dc;word-break:break-all;white-space:pre-wrap}
.copybtn{margin-top:6px;background:#1d212a;color:#6fa8dc;border:1px solid #2b4a63;border-radius:7px;padding:4px 10px;font-size:12px;cursor:pointer}
.copybtn:active{background:#2b4a63}
footer{color:var(--dim);font-size:12px;padding:0 22px 30px}

<figure class="card" data-g="FE" data-k="fe-056 pale lacquer &amp; raden decorative illustration 药铺柜台后抓药的老师傅，百子柜与铜秤 风格名称：pale lacquer &amp; raden decorative illustration。主题：药铺柜台后抓药的老师傅，百子柜与铜秤。参考作者/风格名称：素漆螺钿插画风。核心风格特征：**当代新中式浅色漆画式二维装饰插画，融合中国古典人物画的造型语言与现代平面设计。整体首先呈现为平面装饰画，而非传统工笔写实绘画。造型高度概括，轮廓完整流畅，人物比例与形态根据主题自适应，但始终保持简化、纤细、含蓄；面部几乎不塑造真实体积，五官简洁、符号化、留白化，肤色均匀平整。** **以清晰轮廓、大面积平涂色块和极少量柔和过渡塑造形体，内部细节明显删减并图案化；弱明暗、弱透视、弱空间纵深，不表现真实光源，不使用空气透视和写实景深。** **整体采用高明度、浅暖色基调，但避免颜色过度灰化、粉化和褪色。画面约 65%–80% 保持象牙白、米白、浅杏、暖灰、浅玉色等明亮区域；朱砂、石青、石绿、灰蓝、浅赭等传统矿物色作为有限的中等面积色块使用。整体饱和度在原有浅雅基础上轻微提升约 10%–15%，使朱砂更鲜润、石青更清透、石绿更明确，但仍保持柔和克制，不进入高饱和、浓艳或艳俗状态。** **色彩关系强调“浅底 + 少量较纯色块”的对比：大面积背景和肤色继续保持低饱和、高明度，服饰边缘、器物、花叶、局部装饰可以使用稍纯一些的朱砂红、石青蓝、石绿色形成视觉节奏。避免整幅画平均增艳，也避免所有颜色同时提高饱和度。** **深色只承担少量轮廓、结构与视觉锚点，禁止形成大面积黑色或深褐色块，避免黑漆底、暗金底和厚重宫廷色调。深色面积应明显少于浅色和中性色，整体仍保持通透、明亮、柔和。** **表面保留中国传统漆艺的温润、细腻和微微矿物质感，但以浅色漆面、哑光漆面和柔和矿物颜料质感为主。色彩表面可以具有轻微矿物颜料的颗粒感、天然色差和温润厚度，但不追求厚重黑漆、金箔堆积、高反射或珠宝般光泽。** **螺钿与贝母仅作为极少量的“装饰性镶嵌层”使用，而不是全局材质。虹彩区域控制在画面约 3%–8%，只出现在具有明确装饰属性的局部纹样、边缘、点缀区域或次要表面中；不得随机覆盖主要造型，不改变主体原本的材质属性。** **螺钿效果应呈现为薄片状、细碎、局部、克制的贝母色偏，可出现极轻微的青绿、粉紫、淡蓝虹彩，但综合色彩必须服从整体矿物色体系，而不是形成大片闪光、水晶化、金属化或珠宝化效果。** **尤其保持主体核心形态、皮肤、面部、主要大色块和大面积背景的材质纯净，不被螺钿纹理侵入。虹彩只作为视觉点睛，而不是画面主要质感。** **画面强调装饰性构成，通过平面叠压、轮廓遮挡、局部越界和形状穿插建立层次；空间更接近漆画、壁画、屏风画与现代装饰画的组织逻辑，而不是现实场景透视。** **整体气质明亮、温润、静谧、古雅、精致、轻盈、含蓄。相比传统低饱和新中式插画，色彩稍微更鲜活、更清澈、更有矿物颜料的纯净感，但仍然保持高级、克制和东方审美，不做浓艳国潮，不做鲜艳商业插画。** **避免：大面积黑色、黑漆底、暗金色调、厚重宫廷感、全局螺钿化、随机虹彩覆盖、大块贝壳拼贴、水晶化、珠宝化、过度灰粉、过度奶油色、全画面褪色、低对比到发白、浓艳国潮、高饱和撞色、荧光色、写实工笔、真实人体塑造、现代古风 cg、摄影感、电影光影、真实三维空间、写实山水透视、复杂衣纹、精细刺绣、高密度环境细节、仙侠氛围。**。画幅：3:4。"><a class="imgwrap" href="https://7762-wbweb-5gg1pcdb5539c1c6-1252040857.tcb.qcloud.la/cover-materials/1795695263486-018aex.jpg" target="_blank" rel="noopener"><img loading="lazy" src="https://7762-wbweb-5gg1pcdb5539c1c6-1252040857.tcb.qcloud.la/cover-materials/1795695263486-018aex.jpg" alt="Pale Lacquer &amp; Raden Decorative Illustration"></a><figcaption><div class="line1"><b>FE-056</b><span class="tag ok">已完成</span></div><div class="line2">Pale Lacquer &amp; Rad <figure class="card" data-g="FE" data-k="fe-057 contemporary peking opera comic illustration 采莲归来的姑娘，木盆里堆满莲蓬与荷叶 风格名称：contemporary peking opera comic illustration。主题：采莲归来的姑娘，木盆里堆满莲蓬与荷叶。参考作者/风格名称：当代戏曲漫画插画风。核心风格特征：当代手绘戏曲漫画插画风，借用中国京剧人物画谱、京剧脸谱和老派中国戏曲漫画的造型语言，并以现代插画审美重新简化和整理。古代人物：保留明显的戏曲角色特征。一张图中如果有多个角色，每个人都要有不同眉眼结构，让角色之间通过眼形、眉形、脸型和妆容直接形成区分；避免所有人物共用同一张“京剧脸”。现代人物：不要用脸谱和头饰，但是可以有戏曲式化妆，除了女主角，其他人都不要吊眼角。所有人物比例整体偏短、偏宽、偏压缩，约2.5～3头身，头部相对较大、躯干较短、腿短、手脚小；即使人物处于坐姿、奔跑、打斗或其他动作中，也不要恢复正常写实人体比例，而要始终保持紧凑、团块化、略带笨拙的戏曲漫画体态。人物、动物、器物和环境都可根据性格与剧情进行概括、压缩、夸张和变形，造型紧凑、歪斜、略带拙趣。使用松弛清晰的黑色手绘墨线，搭配经过现代插画化提亮的朱红、翠绿、湖蓝、鹅黄、粉紫、青绿等中高明度东方色彩，以大色块和平涂为主，整体明快、轻盈、干净，不做灰暗复古和仿古做旧。画面强调大轮廓、低细节密度和大量负空间，人物高度概括，场景不必完整展开，只保留最能说明情境的局部元素和少量环境线索，避免复杂建筑、密集军阵、繁复纹样和满画面铺陈。整体既有京剧脸谱和老派戏曲漫画的怪趣、程式感与角色性，又具有当代插画的简洁、鲜亮、轻松和设计感。人物高度概括，背景简洁，保留大量负空间。画幅：3:4。"><a class="imgwrap" href="https://7762-wbweb-5gg1pcdb5539c1c6-1252040857.tcb.qcloud.la/cover-materials/1795696327207-boswg5.jpg" target="_blank" rel="noopener"><img loading="lazy" src="https://7762-wbweb-5gg1pcdb5539c1c6-1252040857.tcb.qcloud.la/cover-materials/1795696327207-boswg5.jpg" alt="Contemporary Peking Opera Comic Illustration"></a><figcaption><div class="line1"><b>FE-057</b><span class="tag ok">已完成</span></div><div class="line2">Contemporary Peking Opera Comic Illustration<span class="tag wm">无水印</span></div><div class="theme">主题：采莲归来的姑娘，木盆里堆满莲蓬与荷叶</div><details class="prompt"><summary>提示词（677 字）</summary><div class="ptext" id="p-fe-057">风格名称：Contemporary Peking Opera Comic Illustration。主题：采莲归来的姑娘，木盆里堆满莲蓬与荷叶。参考作者/风格名称：当代戏曲漫画插画风。核心风格特征：当代手绘戏曲漫画插画风，借用中国京剧人物画谱、京剧脸谱和老派中国戏曲漫画的造型语言，并以现代插画审美重新简化和整理。古代人物：保留明显的戏曲角色特征。一张图中如果有多个角色，每个人都要有不同眉眼结构，让角色之间通过眼形、眉形、脸型和妆容直接形成区分；避免所有人物共用同一张“京剧脸”。现代人物：不要用脸谱和头饰，但是可以有戏曲式化妆，除了女主角，其他人都不要吊眼角。所有人物比例整体偏短、偏宽、偏压缩，约2.5～3头身，头部相对较大、躯干较短、腿短、手脚小；即使人物处于坐姿、奔跑、打斗或其他动作中，也不要恢复正常写实人体比例，而要始终保持紧凑、团块化、略带笨拙的戏曲漫画体态。人物、动物、器物和环境都可根据性格与剧情进行概括、压缩、夸张和变形，造型紧凑、歪斜、略带拙趣。使用松弛清晰的黑色手绘墨线，搭配经过现代插画化提亮的朱红、翠绿、湖蓝、鹅黄、粉紫、青绿等中高明度东方色彩，以大色块和平涂为主，整体明快、轻盈、干净，不做灰暗复古和仿古做旧。画面强调大轮廓、低细节密度和大量负空间，人物高度概括，场景不必完整 <figure class="card" data-g="FG" data-k="fg-023 retro 90s cel anime &amp; korean emotional webtoon illustration, grainy nostalgic film aesthetic 凌晨的鱼粉店，老板娘往碗里撒葱花，蒸汽模糊了眼镜 风格名称：retro 90s cel anime &amp; korean emotional webtoon illustration, grainy nostalgic film aesthetic。主题：凌晨的鱼粉店，老板娘往碗里撒葱花，蒸汽模糊了眼镜。参考作者/风格名称：复古日系赛璐璐与韩系情绪动画 / retro 90s cel anime &amp; korean mood webtoon。核心风格特征：复古日系二维动画与现代韩系情绪漫画融合的插画风格，具有1990年代手绘赛璐璐动画的朴素视觉质感；二维平面绘制，清晰但略带自然手绘感的深色轮廓线，线条轻微不规则，轮廓简洁，细节适度省略；大面积平涂色块，硬边赛璐璐阴影，明暗层次简化，阴影以完整、清晰的形状呈现，几乎没有柔和渐变或复杂体积塑造；整体配色低饱和、暗调、褪色感，偏砖红、暗青绿、灰蓝、灰褐、褪色粉橙与米灰色，色彩之间具有克制的冷暖对比，暗部厚重，黑色深沉；背景采用概括性的色块、简化的形体与有限的细节，呈现二维动画背景美术的平面感，不刻意追求写实精度；全画面覆盖明显、均匀、细密的模拟胶片噪点，颗粒与画面色彩自然融合，轻微色彩漂移、柔和的旧胶片褪色感，带有细微的模拟影像粗糙度；画面具有克制的光影、略低的清晰度、自然的暗部色彩沉积，整体像经过模拟胶片扫描和统一调色处理的旧动画截图；视觉语言安静、内敛、忧郁、怀旧，带有轻微的梦境感和疏离感，质朴而不精致化，强调二维手绘痕迹、色彩氛围和年代质感。画幅：3:4。"><a class="imgwrap" href="https://7762-wbweb-5gg1pcdb5539c1c6-1252040857.tcb.qcloud.la/cover-materials/1795703449914-f64bbg.jpg" target="_blank" rel="noopener"><img loading="lazy" src="https://7762-wbweb-5gg1pcdb5539c1c6-1252040857.tcb.qcloud.la/cover-materials/1795703449914-f64bbg.jpg" alt="Retro 90s Cel Anime &amp; Korean Emotional Webtoon Illustration, Grainy Nostalgic Film Aesthetic"></a><figcaption><div class="line1"><b>FG-023</b><span class="tag ok">已完成</span></div><div class="line2">Retro 90s Cel Anime &amp; Korean Emotional Webtoon Illustration, Grainy Nostalgic Film Aesthetic<span class="tag wm">无水印</span></div><div class="theme">主题：凌晨的鱼粉店，老板娘往碗里撒葱花，蒸汽模糊了眼镜</div><details class="prompt"><summary>提示词（635 字）</summary><div class="ptext" id="p-fg-023">风格名称：Retro 90s Cel Anime &amp; Korean Emotional Webtoon Illustration, Grainy Nostalgic Film Aesthetic。主题：凌晨的鱼粉店，老板娘往碗里撒葱花，蒸汽模糊了眼镜。参考作者/风格名称：复古日系赛璐璐与韩系情绪动画 / Retro 90s Cel Anime &amp; Korean Mood Webtoon。核心风格特征：复古日系二维动画与现代韩系情绪漫画融合的插画风格，具有1990年代手绘赛璐璐动画的朴素视觉质感；二维平面绘制，清晰但略带自然手绘感的深色轮廓线，线条轻微不规则，轮廓简洁，细节适度省略；大面积平涂色块，硬边赛璐璐阴影，明暗层次简化，阴影以完整、清晰的形状呈现，几乎没有柔和渐变或复杂体积塑造；整体配色低饱和、暗调、褪色感，偏砖红、暗青绿、灰蓝、灰褐、褪色粉橙与米灰色，色彩之间具有克制的冷暖对比，暗部厚重，黑色深沉；背景采
